version: "3.9"

services:
  backend:
    build: ./backend
    container_name: netsentinel-api
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      - ./backend:/app
      - netsentinel-data:/app/data
    cap_add:
      - NET_RAW      # Required for Scapy raw packet crafting
      - NET_ADMIN     # Required for network interface access
    network_mode: host  # Use host networking for accurate network scanning
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: netsentinel-ui
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  netsentinel-data:
